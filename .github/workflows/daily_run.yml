name: Daily TED fetch

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TED fetch
        run: python ted_intelligence.py

      - name: Upload Excel output
        uses: actions/upload-artifact@v4
        with:
          name: ted-tenders-${{ github.run_id }}
          path: ted_tenders.xlsx
          retention-days: 30
