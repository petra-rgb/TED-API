name: Daily TED fetch
 
on:
  schedule:
    - cron: "0 7 * * 1-5"    # 07:00 UTC Mon–Fri (09:00 Amsterdam)
  workflow_dispatch:           # manual trigger from GitHub UI
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit results back
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run TED fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ted_intelligence.py
 
      - name: Commit results back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ted_results.csv
          git diff --staged --quiet || git commit -m "Daily TED fetch $(date -u +%Y-%m-%d)"
          git push
 
